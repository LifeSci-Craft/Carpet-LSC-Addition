org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Minecraft / Fabric  (26.1, 26.2, 26.3 are all supported by one jar)
minecraft_version=26.3
loader_version=0.19.5
fabric_version=0.163.0+26.3

# Accepted Minecraft range declared in fabric.mod.json
minecraft_dependency=>=26.1 <26.4

# fabric-carpet (compile-time dependency; must also be present on the server at runtime)
carpet_version=26.3
carpet_dependency=>=26.1

# Mod metadata
mod_version=1.0.0
maven_group=lifescicraft
archives_base_name=carpet-lsc-addition
